name: CI/CD Pipeline CVBoost AWS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        env:
          SECRET_KEY: test-secret-key-ci
          DATABASE_URL: sqlite:///:memory:
          COOKIE_SECURE: "false"
        run: |
          python -m unittest discover tests

  build-and-deploy-aws:
    name: Build Docker Image & Deploy to AWS (ECR / App Runner / ECS)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-3' }}

      - name: Log in to Amazon Elastic Container Registry (ECR)
        if: env.AWS_ACCESS_KEY_ID != ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}

      - name: Build, tag, and push Docker image to Amazon ECR
        if: env.AWS_ACCESS_KEY_ID != '' && env.ECR_REPOSITORY != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # Déploiement automatique sur AWS App Runner (PaaS Managé) si configuré
      - name: Deploy to AWS App Runner
        if: env.AWS_APP_RUNNER_ARN != ''
        env:
          AWS_APP_RUNNER_ARN: ${{ secrets.AWS_APP_RUNNER_ARN }}
        run: |
          aws apprunner start-deployment --service-arn ${{ secrets.AWS_APP_RUNNER_ARN }}

      # Déploiement alternatif sur AWS ECS Fargate si configuré
      - name: Deploy to AWS ECS Fargate
        if: env.AWS_ECS_CLUSTER != '' && env.AWS_ECS_SERVICE != ''
        env:
          AWS_ECS_CLUSTER: ${{ secrets.AWS_ECS_CLUSTER }}
          AWS_ECS_SERVICE: ${{ secrets.AWS_ECS_SERVICE }}
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.AWS_ECS_CLUSTER }} \
            --service ${{ secrets.AWS_ECS_SERVICE }} \
            --force-new-deployment
