version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    image: cvboost:latest
    container_name: cvboost_web
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: sqlite:////app/instance/cvboost.db
      UPLOAD_FOLDER: /app/uploads
      UPLOAD_AUDIT_LOG: /app/instance/upload_audit.jsonl
      JOB_OFFERS_FILE: /app/data_pipeline/jobs_clean.csv
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}
    expose:
      - "8000"
    volumes:
      - cvboost_instance:/app/instance
      - cvboost_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: cvboost_caddy
    restart: unless-stopped
    environment:
      DOMAIN: "${DOMAIN:?Set DOMAIN in the root .env file}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  api:
    profiles:
      - audio-api
    build:
      context: ..
      dockerfile: Dockerfile
    image: cvboost:latest
    container_name: cvboost_fastapi
    command: ["uvicorn", "api_service.main:app", "--host", "0.0.0.0", "--port", "8001"]
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
    volumes:
      - cvboost_audio:/app/api_service/temp_audio

volumes:
  cvboost_instance:
  cvboost_uploads:
  cvboost_audio:
  caddy_data:
  caddy_config:
